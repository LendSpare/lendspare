version: "2"

run:
  go: "1.25"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nolintlint
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Win32 calls: the returned error is GetLastError, set even on success.
        - (*syscall.LazyProc).Call
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [bodyclose, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/LendSpare/lendspare
